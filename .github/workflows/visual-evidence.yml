name: Windows visual evidence
on:
  push:
    branches: [codex/windows-visual-evidence]
permissions:
  contents: read
jobs:
  visual:
    runs-on: windows-2022
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Capture the application
        shell: powershell
        run: |
          .\tools\test-ui-sweep.ps1 -Out visual-evidence -Looks flow-light,atelier-dark -Sizes 1000x740,760x650 -SkipStress -Interactions
          Get-Content visual-evidence\report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-visual-evidence
          path: |
            visual-evidence/pages
            visual-evidence/sheet-*.png
            visual-evidence/report.md
            visual-evidence/states
            visual-evidence/controls.csv
          if-no-files-found: error
          retention-days: 10
