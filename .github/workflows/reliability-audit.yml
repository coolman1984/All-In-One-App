name: Verify reliability repairs on Windows

on:
  push:
    branches:
      - codex/reliability-audit-windows-check

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: saved-work
            suites: reliability,document-close,regressions,saved-work
          - group: companion
            suites: sqlite-vault,assistant-harness,hermes-memory,workflow-recorder
          - group: desktop
            suites: forms,dashboard,layout,capture,snip-output,recorder,visual,responsiveness,explorer-paint,leader-team
    name: Windows ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
      - name: Build with Windows .NET Framework
        shell: powershell
        run: .\tools\test-build.ps1
      - name: Run Windows regression fixtures
        shell: powershell
        env:
          AUDIT_WINDOWS_SUITES: ${{ matrix.suites }}
        run: |
          $failed = @()
          foreach ($suite in $env:AUDIT_WINDOWS_SUITES.Split(',')) {
              & powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File "tools\test-$suite.ps1"
              if ($LASTEXITCODE -ne 0) { $failed += $suite }
              else { Write-Host "Verified $suite (exit 0)" }
          }
          if ($failed.Count) { throw ("Windows suites failed: " + ($failed -join ', ')) }
